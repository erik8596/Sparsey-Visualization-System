<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparsey Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <h1>Sparsey Visualization</h1>
    <label for="modelSelect">Select WandB Run:</label>
    <select id="modelSelect"></select>
    <button onclick="loadModel()">Visualize</button>
    <div id="threejs-container" style="width: 100%; height: 80vh;"></div>

    <script>
        let scene, camera, renderer, controls;

        async function loadModels() {
            try {
                let response = await fetch('/get_models');
                let models = await response.json();

                console.log("Fetched models from Flask:", models);  // Debugging log

                let modelSelect = document.getElementById('modelSelect');
                modelSelect.innerHTML = '';  // Clear previous options

                models.forEach(model => {
                    let option = document.createElement('option');
                    option.value = model.value;
                    option.textContent = model.label;
                    modelSelect.appendChild(option);
                });

                console.log("Dropdown successfully updated!");

            } catch (error) {
                console.error("Error fetching models:", error);
                alert("Failed to load models. Check the console.");
            }
        }


        async function loadModel() {
          let modelDropdown = document.getElementById('modelSelect');
          let selectedIndex = modelDropdown.selectedIndex;

          if (selectedIndex < 0) {
              alert("Please select a model!");
              return;
          }

          let selectedOption = modelDropdown.options[selectedIndex];
          let model = selectedOption.value;

          console.log("🚀 Sending model ID:", model);  // Debugging log

          if (!model) {
              alert("No model selected!");
              return;
          }

          let response = await fetch('/visualize', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ model })  // Send only model ID
          });

          let data = await response.json();
          console.log("📥 Received visualization data:", data);

          if (data.error) {
              alert("Error: " + data.error);
              return;
          }

          visualizeData(data.layers);
      }



        function visualizeData(layers) {
            // Clear existing scene
            if (scene) {
                while (scene.children.length > 0) {
                    scene.remove(scene.children[0]);
                }
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);  // Set white background

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('threejs-container').appendChild(renderer.domElement);

            // Add orbit controls for zoom and pan
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 200;
            controls.screenSpacePanning = false;

            const mac_spacing = 1.33;  // Increase spacing between MACs

            layers.forEach(element => {
                let shape, material, points, lineGeometry, line;

                if (element.type === "mac") {
                    shape = new THREE.Shape();
                    drawHexagon(shape, 2.0);  // Adjust MAC size here
                    material = new THREE.LineBasicMaterial({ color: 0x0000ff, linewidth: 1 });  // Thin blue line
                } else if (element.type === "cm") {
                    shape = new THREE.Shape();
                    drawHexagon(shape, 0.5);  // Adjust CM size here
                    material = new THREE.LineBasicMaterial({ color: 0x008000, linewidth: 1 });  // Thin green line
                } else if (element.type === "neuron") {
                    shape = new THREE.Shape();
                    drawCircle(shape, 0.10);  // Adjust neuron size here
                    material = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 });  // Thin black line
                }

                // Convert shape to line geometry
                points = shape.getPoints();
                lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                line = new THREE.LineLoop(lineGeometry, material);
                line.position.set(element.x, element.y * mac_spacing, element.z);
                scene.add(line);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        // Function to draw a hexagon outline
        function drawHexagon(shape, size) {
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i;
                let x = size * Math.cos(angle);
                let y = size * Math.sin(angle);
                if (i === 0) {
                    shape.moveTo(x, y);
                } else {
                    shape.lineTo(x, y);
                }
            }
            shape.closePath();
        }

        // Function to draw a circle outline
        function drawCircle(shape, radius) {
            const numSegments = 50;  // Smooth circle outline
            for (let i = 0; i < numSegments; i++) {
                let angle = (Math.PI * 2 / numSegments) * i;
                let x = radius * Math.cos(angle);
                let y = radius * Math.sin(angle);
                if (i === 0) {
                    shape.moveTo(x, y);
                } else {
                    shape.lineTo(x, y);
                }
            }
            shape.closePath();
        }

        window.onload = loadModels;
    </script>
</body>
</html>
