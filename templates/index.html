<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparsey Visualization</title>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <h1>Sparsey Visualization</h1>

    <!-- Project Selection -->
    <label for="projectSelect">Select W&B Project:</label>
    <select id="projectSelect">
        <option value="" disabled selected>Loading projects...</option>
    </select>

    <!-- Run Selection -->
    <label for="runSelect">Select W&B Run:</label>
    <select id="runSelect" disabled>
        <option value="" disabled selected>Select a project first</option>
    </select>

    <button onclick="loadRun()" disabled id="visualizeButton">Visualize</button>

    <!-- TODO: Adding an indicator to indicate the current loaded run to prevent confusion-->
    <!-- <label for="loadedRun">Loaded Run:</label>
    <textarea name="loadedRun" id="loadedRunArea">N/A</textarea> -->

    <div id="threejs-container"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>
