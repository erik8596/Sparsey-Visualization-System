<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparsey Visualization</title>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts for Inter, IBM Plex Sans, Source Sans Pro & Fira Code -->
  <link href="https://fonts.googleapis.com/css2?
      family=Inter:wght@400;500;600;700&
      family=IBM+Plex+Sans:wght@400;500;600;700&
      family=Source+Sans+Pro:wght@400;600;700&
      family=Fira+Code:wght@400;500;700&
      display=swap" rel="stylesheet" />
  <!-- OrbitControls for Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body class="panel-closed-1 panel-closed-2">
  <header>
    <h1>The Sparsey Visualization System</h1>
    <div class="controls">
      <label for="projectSelect">Select W&B Project:</label>
      <select id="projectSelect">
        <option value="" disabled selected>Loading projects...</option>
      </select>
      <label for="runSelect">Select W&B Run:</label>
      <select id="runSelect" disabled>
        <option value="" disabled selected>Select a project first</option>
      </select>
      <button id="visualizeButton" disabled>Visualize</button>
    </div>
    <div id="mac-details-container">
      <div id="mac-details-row">
        <div id="mac-details-header">MAC Details</div>
        <button id="resetButton">Reset Toggled MACs</button>
      </div>
      <div id="mac-details-msg">(Click on a MAC to see its details below)</div>
    </div>
  </header>

  <main>
    <!-- Panel 1 -->
    <div id="left-side-panel-1" class="collapsed side-panel">
      <div id="camera-control-pane" class="side-panel-box">
        <h4 class="camera-controls-header">Camera Controls</h4>
        <button id="panButton">Pan Mode</button>
        <button id="bothButton">Default Mode</button>
        <button id="resetControls">Reset Camera</button>
      </div>
      <div id="uniform-layer-scales" class="side-panel-box hidden">
        <h4>Individual Layer Controls</h4>
      </div>
      <div id="full-model-controls-box" class="side-panel-box hidden">
        <h4>Full Model Controls</h4>
        <div class="slider-group">
          <label for="layerSpacingSlider" class="slider-label">Layer Spacing:</label>
          <input type="range" id="layerSpacingSlider" class="layer-slider" min="5" max="50" step="0.5" value="10">
          <button id="resetSpacingBtn" class="slider-reset-btn">Reset</button>
        </div>
        <div class="slider-group">
          <label for="weightedConnectionsCheckbox" class="slider-label">
            Show All Weighted Connections:
          </label>
          <input type="checkbox" id="weightedConnectionsCheckbox" />
        </div>
        <button id="resetModelBtn" class="slider-reset-btn reset-model-btn">RESET ALL</button>
      </div>
    </div>

    <!-- Toggle for Panel 1 -->
    <button id="toggle-panel-btn-1" class="toggle-button toggle-with-text" title="Controls"
      aria-label="Open Controls Panel" style="bottom: 30px; left: 0;">
      <span class="toggle-icon">☰</span>
      <span class="toggle-text">Controls</span>
    </button>

    <!-- Panel 2 -->
    <div id="left-side-panel-2" class="collapsed side-panel">
      <div class="side-panel-box">
        <h4>Step Selection</h4>
        <div class="step-controls">
          <span id="currentStepDisplay">No step selected</span>
          <div class="step-navigation">
            <button id="prevStepBtn" class="step-nav-btn" disabled>&lt; Previous</button>
            <button id="nextStepBtn" class="step-nav-btn" disabled>Next &gt;</button>
          </div>
        </div>
        <select id="stepSelect" size="20">
          <option value="" disabled selected>Loading steps...</option>
        </select>
      </div>
    </div>

    <!-- Toggle for Panel 2 -->
    <button id="toggle-panel-btn-2" class="toggle-button toggle-with-text" title="Steps" aria-label="Open Steps Panel"
      style="bottom: 80px; left: 0;">
      <span class="toggle-icon">☰</span>
      <span class="toggle-text">Steps</span>
    </button>

    <!-- Three.js Scene Container -->
    <div id="threejs-container"></div>
    <div id="side-panel"></div>
    <div id="bottom-panel"></div>
  </main>

  <script type="module" src="/static/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const body = document.body;

      // Panel 1 toggle
      const panel1 = document.getElementById('left-side-panel-1');
      document.getElementById('toggle-panel-btn-1').addEventListener('click', () => {
        const open = panel1.classList.toggle('open');
        panel1.classList.toggle('collapsed', !open);
        body.classList.toggle('panel-open-1', open);
        body.classList.toggle('panel-closed-1', !open);
      });

      // Panel 2 toggle
      const panel2 = document.getElementById('left-side-panel-2');
      document.getElementById('toggle-panel-btn-2').addEventListener('click', () => {
        const open = panel2.classList.toggle('open');
        panel2.classList.toggle('collapsed', !open);
        body.classList.toggle('panel-open-2', open);
        body.classList.toggle('panel-closed-2', !open);
      });

      // Step navigation buttons (will be enabled once steps are loaded)
      const prevStepBtn = document.getElementById('prevStepBtn');
      const nextStepBtn = document.getElementById('nextStepBtn');

      if (prevStepBtn && nextStepBtn) {
        prevStepBtn.addEventListener('click', () => {
          if (window.currentStepIndex > 0) {
            selectStep(window.steps[window.currentStepIndex - 1]);
          }
        });

        nextStepBtn.addEventListener('click', () => {
          if (window.currentStepIndex < window.steps.length - 1) {
            selectStep(window.steps[window.currentStepIndex + 1]);
          }
        });
      }

      // Global function to update steps
      window.updateStepsUI = function (steps) {
        window.steps = steps || [];
        const stepSelect = document.getElementById('stepSelect');
        const currentStepDisplay = document.getElementById('currentStepDisplay');

        if (!stepSelect) return;

        // Clear existing options
        stepSelect.innerHTML = '';

        if (steps && steps.length > 0) {
          // Add all steps to the dropdown
          steps.forEach((step) => {
            const option = document.createElement('option');
            option.value = step;
            option.textContent = `Step ${step}`;
            stepSelect.appendChild(option);
          });

          // Set event listener
          stepSelect.addEventListener('change', (e) => {
            const selectedStep = parseInt(e.target.value);
            selectStep(selectedStep);
          });

          // Update UI state
          window.currentStepIndex = 0;
          currentStepDisplay.textContent = `Step ${steps[0]} of ${steps.length}`;
          prevStepBtn.disabled = true;
          nextStepBtn.disabled = steps.length <= 1;
        } else {
          // No steps available
          const option = document.createElement('option');
          option.value = "";
          option.disabled = true;
          option.selected = true;
          option.textContent = "No steps available";
          stepSelect.appendChild(option);

          currentStepDisplay.textContent = "No steps available";
          prevStepBtn.disabled = true;
          nextStepBtn.disabled = true;
        }
      };

      // Function to select a step
      function selectStep(step) {
        const stepSelect = document.getElementById('stepSelect');
        const currentStepDisplay = document.getElementById('currentStepDisplay');
        const prevStepBtn = document.getElementById('prevStepBtn');
        const nextStepBtn = document.getElementById('nextStepBtn');

        if (!window.steps || window.steps.length === 0) return;

        // Update selected step in dropdown
        if (stepSelect) stepSelect.value = step;

        // Set current step index
        window.currentStepIndex = window.steps.indexOf(step);

        // Update navigation buttons
        if (prevStepBtn) prevStepBtn.disabled = window.currentStepIndex <= 0;
        if (nextStepBtn) nextStepBtn.disabled = window.currentStepIndex >= window.steps.length - 1;

        // Update display
        if (currentStepDisplay) {
          currentStepDisplay.textContent = `Step ${step} of ${window.steps.length}`;
        }

        // Trigger step fetch if we have a function to do that
        if (typeof window.fetchStepData === 'function') {
          window.fetchStepData(step);
        }
      }

      // Initialize with empty steps until data is loaded
      window.updateStepsUI([]);
    });
  </script>
</body>

</html>
