<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparsey Visualization</title>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls for Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="panel-closed">
  <header>
    <h1>Sparsey Visualization</h1>
    <!-- Project and Run Selection -->
    <div class="controls">
      <label for="projectSelect">Select W&B Project:</label>
      <select id="projectSelect">
        <option value="" disabled selected>Loading projects...</option>
      </select>
      <label for="runSelect">Select W&B Run:</label>
      <select id="runSelect" disabled>
        <option value="" disabled selected>Select a project first</option>
      </select>
      <button id="visualizeButton" disabled>Visualize</button>
    </div>
    <!-- MAC Details and Reset Button -->
    <div id="mac-details-container">
      <div id="mac-details-row">
        <div id="mac-details-header">MAC Details</div>
        <button id="resetButton">Reset Toggled MACs</button>
      </div>
      <div id="mac-details-msg">(Click on a MAC to see its details)</div>
    </div>
  </header>

  <main>
    <!-- Left Side Panel -->
    <div id="left-side-panel" class="collapsed">
      <div id="camera-control-pane" class="side-panel-box">
        <h4 class="camera-controls-header">Camera Controls</h4>
        <button id="panButton">Pan Mode</button>
        <button id="bothButton">Default Mode</button>
        <button id="resetControls">Reset Camera</button>
      </div>
      <!-- Uniform Layer Controls (initially hidden) -->
      <div id="uniform-layer-scales" class="side-panel-box hidden">
        <h4>Individual Layer Controls</h4>
        <!-- Dynamic controls will be injected here -->
      </div>
      <!-- Full Model Controls (initially hidden) -->
      <div id="full-model-controls-box" class="side-panel-box hidden">
        <h4>Full Model Controls</h4>
        <div class="slider-group">
          <label for="layerSpacingSlider" class="slider-label">Layer Spacing:</label>
          <input type="range" id="layerSpacingSlider" class="layer-slider" min="5" max="50" step="0.5" value="10">
          <button id="resetSpacingBtn" class="slider-reset-btn">Reset</button>
        </div>
        <button id="resetModelBtn" class="slider-reset-btn reset-model-btn">RESET ALL</button>
      </div>
    </div>

    <!-- Toggle Button: fixed at bottom left (its left offset is set by body state) -->
    <button id="toggle-panel-btn" class="toggle-button">☰</button>

    <!-- Three.js Scene Container -->
    <div id="threejs-container"></div>
    <!-- Side panel for dynamic canvases -->
    <div id="side-panel"></div>
    <!-- Bottom panel (if needed) -->
    <div id="bottom-panel"></div>
  </main>

  <script type="module" src="/static/js/app.js"></script>
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      const leftPanel = document.getElementById('left-side-panel');
      const toggleButton = document.getElementById('toggle-panel-btn');
      const body = document.body;
      if (toggleButton && leftPanel) {
        toggleButton.addEventListener('click', () => {
          if (body.classList.contains('panel-open')) {
            body.classList.remove('panel-open');
            body.classList.add('panel-closed');
            leftPanel.classList.remove('open');
            leftPanel.classList.add('collapsed');
          } else {
            body.classList.remove('panel-closed');
            body.classList.add('panel-open');
            leftPanel.classList.remove('collapsed');
            leftPanel.classList.add('open');
          }
          console.log("Body classes:", body.className);
          console.log("Left panel classes:", leftPanel.className);
        });
      }
    });
  </script>
</body>
</html>
